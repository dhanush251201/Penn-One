# Publishes the built replay and dispatch console (penn-one-twin/viz/*.html) to GitHub Pages.
# The pages carry their data inline, so this only copies them; rebuild them locally
# (see penn-one-twin/README.md, "Pages") and push to update the site.
# One-time setup by a repo admin: Settings -> Pages -> Source: GitHub Actions.
name: Publish replay to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "penn-one-twin/viz/*.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Collect the pages
        run: |
          mkdir -p _site
          cp penn-one-twin/viz/replay.html penn-one-twin/viz/ops.html _site/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=replay.html">
          <title>Penn-One Evening Replay</title>
          <p><a href="replay.html">Evening replay</a> · <a href="ops.html">Dispatch console</a></p>
          EOF
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
